[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seedmesh"
version = "0.1.0.dev0"
description = "Reputation and verification layer for public peer-to-peer inference swarms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Seedmesh contributors" }]
keywords = ["p2p", "inference", "distributed", "reputation", "dht"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
]

# The core deliberately depends on neither torch nor petals. See docs/architecture.md
# ("The backend seam") for why: the reputation and verification layers are the novel
# engineering in this project, and their correctness must not be hostage to a fork of
# a codebase that has been unmaintained since 2024-09-07.
dependencies = [
    "numpy>=1.24",
    "cryptography>=41",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
# Installing the Petals backend is intentionally a separate, opt-in extra with its own
# hard constraints. It does NOT work on Python 3.13 (numpy<2 has no 3.13 wheels) and it
# does not work natively on Windows. See docs/findings-upstream-audit.md.
petals = ["petals @ git+https://github.com/bigscience-workshop/petals.git"]

[project.scripts]
seedmesh = "seedmesh.cli.main:main"

[project.urls]
Homepage = "https://github.com/seedmesh/seedmesh"
Documentation = "https://github.com/seedmesh/seedmesh/tree/main/docs"

[tool.setuptools.packages.find]
include = ["seedmesh*"]

[tool.setuptools.package-data]
seedmesh = ["models/*.yaml", "swarm.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
